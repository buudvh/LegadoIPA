name: Build Unsigned iOS App

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]
  workflow_dispatch: # Cho phép kích hoạt chạy tay trên GitHub

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install XcodeGen
      run: |
        brew install xcodegen

    - name: Generate Xcode Project
      run: |
        xcodegen generate

    - name: Resolve Swift Package Dependencies
      run: |
        xcodebuild -resolvePackageDependencies -project LegadoIPA.xcodeproj -scheme LegadoIPA

    - name: Build App
      run: |
        xcodebuild build \
          -project LegadoIPA.xcodeproj \
          -scheme LegadoIPA \
          -sdk iphoneos \
          -configuration Release \
          -derivedDataPath build_output \
          CODE_SIGNING_ALLOWED=NO \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGN_IDENTITY=""

    - name: Package to IPA
      run: |
        mkdir -p build_output/Payload
        cp -r build_output/Build/Products/Release-iphoneos/LegadoIPA.app build_output/Payload/
        cd build_output
        zip -r LegadoIPA.ipa Payload
        echo "IPA package created successfully."

    - name: Upload Unsigned IPA
      uses: actions/upload-artifact@v4
      with:
        name: LegadoIPA-Unsigned
        path: build_output/LegadoIPA.ipa
        if-no-files-found: error
        retention-days: 7
